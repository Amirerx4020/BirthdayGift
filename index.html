<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>هدیه‌ی تولد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-deep: #0a0612;
    --bg-purple: #1c0e33;
    --pink: #ff2e7e;
    --cyan: #17e6d8;
    --yellow: #ffd23f;
    --text: #f3eefc;
    --text-dim: #b7a9d6;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg-deep);
    color: var(--text);
    font-family: 'Vazirmatn', sans-serif;
    min-height: 100vh;
  }

  body {
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255,46,126,0.25), transparent),
      radial-gradient(ellipse 60% 40% at 90% 100%, rgba(23,230,216,0.15), transparent),
      var(--bg-deep);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }

  .scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 1px,
      transparent 3px
    );
    z-index: 1;
  }

  .hero {
    text-align: center;
    margin-top: 20px;
    margin-bottom: 36px;
  }

  .eyebrow {
    color: var(--cyan);
    font-size: 13px;
    letter-spacing: 0.15em;
    margin-bottom: 10px;
    font-weight: 600;
  }

  .title {
    font-family: 'Anton', sans-serif;
    font-size: clamp(42px, 13vw, 68px);
    line-height: 0.95;
    margin: 0;
    color: var(--yellow);
    text-shadow:
      3px 3px 0 var(--pink),
      -2px -2px 0 var(--cyan);
    letter-spacing: 0.02em;
    direction: ltr;
    font-style: italic;
  }

  .subtitle {
    color: var(--text-dim);
    font-size: 16px;
    margin-top: 14px;
    max-width: 320px;
    margin-inline: auto;
    line-height: 1.7;
  }

  .card {
    background: linear-gradient(160deg, var(--bg-purple), #120821);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 26px 22px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 0 40px rgba(255,46,126,0.08);
    position: relative;
    z-index: 2;
  }

  .step {
    display: flex;
    gap: 14px;
    align-items: flex-start;
    margin-bottom: 20px;
  }

  .step-marker {
    flex-shrink: 0;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--pink);
    color: #1a0b2e;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .step-body h3 {
    margin: 0 0 4px;
    font-size: 15px;
    font-weight: 800;
    color: var(--text);
  }

  .step-body p {
    margin: 0;
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
    margin: 20px 0;
  }

  .phone-form {
    display: flex;
    gap: 10px;
  }

  .phone-input {
    flex: 1;
    background: #0a0612;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px;
    padding: 14px 12px;
    color: var(--text);
    font-size: 18px;
    letter-spacing: 0.05em;
    text-align: center;
    direction: ltr;
    font-family: 'Vazirmatn', sans-serif;
    outline: none;
    transition: border-color 0.2s;
  }

  .phone-input:focus {
    border-color: var(--cyan);
  }

  .verify-btn {
    background: var(--pink);
    color: #1a0b2e;
    border: none;
    border-radius: 10px;
    padding: 0 20px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    transition: transform 0.15s;
    font-family: 'Vazirmatn', sans-serif;
  }

  .verify-btn:active {
    transform: scale(0.96);
  }

  .verify-btn:disabled {
    opacity: 0.5;
    cursor: default;
  }

  .msg {
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
    min-height: 20px;
  }

  .msg.error { color: #ff6b81; }
  .msg.loading { color: var(--text-dim); }

  .reveal {
    display: none;
    margin-top: 6px;
    text-align: center;
    animation: pop 0.4s ease;
  }

  .reveal.show { display: block; }

  @keyframes pop {
    from { opacity: 0; transform: scale(0.85); }
    to { opacity: 1; transform: scale(1); }
  }

  .reveal-label {
    font-size: 13px;
    color: var(--cyan);
    letter-spacing: 0.1em;
    margin-bottom: 8px;
  }

  .gift-code {
    font-family: 'Anton', sans-serif;
    font-size: 24px;
    letter-spacing: 0.06em;
    background: #0a0612;
    border: 1px dashed var(--yellow);
    border-radius: 10px;
    padding: 16px 10px;
    color: var(--yellow);
    direction: ltr;
    word-break: break-all;
  }

  .copy-btn {
    margin-top: 12px;
    background: transparent;
    border: 1px solid var(--cyan);
    color: var(--cyan);
    padding: 10px 18px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Vazirmatn', sans-serif;
  }

  .footer-note {
    margin-top: 26px;
    color: var(--text-dim);
    font-size: 12px;
    text-align: center;
    max-width: 300px;
  }
</style>
</head>
<body>
<div class="scanlines"></div>

<div class="hero">
  <div class="eyebrow">HAPPY BIRTHDAY</div>
  <h1 class="title">GIFT<br>UNLOCK</h1>
  <p class="subtitle">شماره موبایلت رو وارد کن تا کادوت باز بشه.</p>
</div>

<div class="card">
  <div class="step">
    <div class="step-marker">۱</div>
    <div class="step-body">
      <h3>شماره موبایلت رو وارد کن</h3>
      <p>همون شماره‌ای که باهاش می‌شناسمت.</p>
    </div>
  </div>

  <div class="divider"></div>

  <form class="phone-form" id="phone-form">
    <input type="tel" class="phone-input" id="phone-input" placeholder="09xxxxxxxxx" inputmode="tel" autocomplete="tel" dir="ltr">
    <button type="submit" class="verify-btn" id="verify-btn">بازکردن</button>
  </form>

  <div class="msg" id="msg"></div>

  <div class="reveal" id="reveal">
    <div class="reveal-label">کد گیفت کارت پلی‌استیشن</div>
    <div class="gift-code" id="gift-code"></div>
    <button class="copy-btn" id="copy-btn">کپی کد</button>
  </div>
</div>

<p class="footer-note">تولدت مبارک 🎮 امیدوارم بهت خوش بگذره.</p>

<script>
  // این سه مقدار رو با خروجی generate-secret.js جایگزین کن
  const SALT = "C33FkaMGkkoxfk0uGoZrtw==";
  const IV = "3ZijgtFjaNDdyEhR";
  const CIPHERTEXT = "/bsIJtLa1kQi+zZlAcV2cpBVTt3x7GUs";

  function normalizePhone(raw) {
    return String(raw).replace(/\D/g, '').slice(-10);
  }

  function base64ToBytes(b64) {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }

  async function tryUnlock(phone) {
    const normalized = normalizePhone(phone);
    const keyMaterial = await crypto.subtle.importKey(
      'raw',
      new TextEncoder().encode(normalized),
      'PBKDF2',
      false,
      ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: base64ToBytes(SALT), iterations: 150000, hash: 'SHA-256' },
      keyMaterial,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const plainBuffer = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: base64ToBytes(IV) },
      key,
      base64ToBytes(CIPHERTEXT)
    );
    return new TextDecoder().decode(plainBuffer);
  }

  const form = document.getElementById('phone-form');
  const input = document.getElementById('phone-input');
  const btn = document.getElementById('verify-btn');
  const msg = document.getElementById('msg');
  const reveal = document.getElementById('reveal');
  const giftCodeEl = document.getElementById('gift-code');
  const copyBtn = document.getElementById('copy-btn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const phone = input.value.trim();
    if (!phone) return;

    btn.disabled = true;
    msg.textContent = 'در حال بررسی...';
    msg.className = 'msg loading';

    try {
      const giftCode = await tryUnlock(phone);
      msg.textContent = '';
      giftCodeEl.textContent = giftCode;
      reveal.classList.add('show');
      form.style.display = 'none';
    } catch (err) {
      msg.textContent = 'این شماره درست نیست. دوباره چک کن.';
      msg.className = 'msg error';
    } finally {
      btn.disabled = false;
    }
  });

  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(giftCodeEl.textContent);
    copyBtn.textContent = 'کپی شد ✓';
    setTimeout(() => (copyBtn.textContent = 'کپی کد'), 1500);
  });
</script>
</body>
</html>
